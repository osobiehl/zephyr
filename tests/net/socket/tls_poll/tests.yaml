common:
  tags:
    - net
    - socket
    - tls
    - poll
  platform_allow:
    - native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  harness: pytest
  timeout: 60
tests:
  net.socket.tls.poll.nsos: {}
  net.socket.tls.poll.client_native:
    harness: console
    harness_config:
      type: one_line
      regex:
        - CLIENT_HANDSHAKE_OK
    extra_configs:
      - CONFIG_NET_SOCKETS_OFFLOAD=n
      - CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=n
      - CONFIG_NET_LOOPBACK=y
