common:
  tags:
    - net
    - socket
    - tls
    - poll
  platform_allow:
    - native_sim/native/64
  integration_platforms:
    - native_sim/native/64
tests:
  net.socket.tls.poll.update: {}
  net.socket.tls.poll.update.nsos:
    extra_configs:
      - CONFIG_NET_LOOPBACK=n
      - CONFIG_NET_SOCKETS_OFFLOAD=y
      - CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
